```html
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Ads Counter</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #253a31 0%, #101512 42%, #080a09 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 35px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 62px;
      height: 62px;
      margin: auto;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.25);
    }

    .title {
      margin-top: 16px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-top: 7px;
      color: #9ba69f;
      font-size: 14px;
    }

    .card {
      background: rgba(255,255,255,0.075);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 27px;
      padding: 30px 22px;
      text-align: center;
      box-shadow:
        0 25px 60px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.05);
      backdrop-filter: blur(15px);
    }

    .label {
      color: #a9b2ad;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      font-weight: 700;
    }

    .count {
      margin-top: 10px;
      font-size: 72px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -3px;
    }

    .count-small {
      margin-top: 9px;
      color: #8d9992;
      font-size: 13px;
    }

    .watch-btn {
      width: 100%;
      height: 61px;
      margin-top: 24px;
      border: 0;

      background: linear-gradient(135deg, #79e3a1, #43b977);
      color: #07120b;

      font-weight: 900;
      letter-spacing: 0.7px;

      transform: scale(0.97);

    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #65716a;
      font-size: 11px;
    }
  </style>
</head>


<body>

  <main class="app">

    <div class="header">

      <div class="logo">
        ▶
      </div>

      <div class="title">
        Ads Counter
      </div>

      <div class="subtitle">
        Watch ads and increase your count
      </div>

    </div>


    <section class="card">

      <div class="label">
        Ads Watched
      </div>

      <div
        class="count"
        id="adsCount"
      >
        0
      </div>

      <div class="count-small">
        Total completed visits
      </div>

      <button
        class="watch-btn"
        id="watchBtn"
      >
        WATCH ADS
      </button>

      <div
        class="status"
        id="status"
      ></div>

    </section>


    <div class="footer">
      Return to the app after visiting the ad
    </div>

  </main>


  <script>

    /*
    ==================================================
      SMART LINK
    ==================================================
    */

    const SMART_LINK =
      "https://www.profitableratecpmnetwork.com/a083yept13?key=d399c3748eeec8e565ec116687f5d3b5";


    /*
    ==================================================
      ELEMENTS
    ==================================================
    */

    const countElement =
      document.getElementById("adsCount");

    const watchButton =
      document.getElementById("watchBtn");

    const statusElement =
      document.getElementById("status");


    /*
    ==================================================
      LOAD COUNT
    ==================================================
    */

    let adsCount = Number(
      localStorage.getItem("adsCount") || 0
    );

    countElement.textContent = adsCount;


    /*
    ==================================================
      STATE
    ==================================================
    */

    let waitingForReturn = false;

    let openedTime = 0;


    /*
    ==================================================
      OPEN SMART LINK
    ==================================================
    */

    watchButton.addEventListener("click", function () {

      if (waitingForReturn) {
        return;
      }

      waitingForReturn = true;

      openedTime = Date.now();

      watchButton.disabled = true;

      watchButton.textContent =
        "OPENING ADS...";

      statusElement.textContent =
        "Your browser is opening...";


      /*
      --------------------------------------------------
      IMPORTANT

      _system tells Capacitor/Cordova style WebViews
      to open the URL outside the WebView.

      --------------------------------------------------
      */

      let opened = false;

      try {

        const newWindow =
          window.open(
            SMART_LINK,
            "_system"
          );

        if (newWindow) {
          opened = true;
        }

      } catch (e) {

        console.log(
          "External browser error:",
          e
        );

      }


      /*
      --------------------------------------------------
      FALLBACK

      If _system isn't supported, try normal browser
      opening.
      --------------------------------------------------
      */

      setTimeout(function () {

        if (!opened) {

          try {

            window.open(
              SMART_LINK,
              "_blank"
            );

          } catch (e) {

            window.location.href =
              SMART_LINK;

          }

        }

      }, 300);


      statusElement.textContent =
        "Return to the app after viewing the ad.";

    });


    /*
    ==================================================
      COUNT WHEN USER RETURNS
    ==================================================
    */

    function userReturnedToApp() {

      if (!waitingForReturn) {
        return;
      }


      const awayTime =
        Date.now() - openedTime;


      /*
      --------------------------------------------------
      Require at least 2 seconds outside the app.
      --------------------------------------------------
      */

      if (awayTime >= 2000) {

        adsCount++;

        localStorage.setItem(
          "adsCount",
          String(adsCount)
        );

        countElement.textContent =
          adsCount;

        statusElement.textContent =
          "✓ Ad visit counted +1";

      } else {

        statusElement.textContent =
          "Please stay outside the app longer.";

      }


      waitingForReturn = false;

      watchButton.disabled = false;

      watchButton.textContent =
        "WATCH ADS";

    }


    /*
    ==================================================
      VISIBILITY CHANGE
    ==================================================
    */

    document.addEventListener(
      "visibilitychange",
      function () {

        if (
          document.visibilityState === "visible"
        ) {

          /*
          Small delay so browser → app transition
          completes properly.
          */

          setTimeout(
            userReturnedToApp,
            500
          );

        }

      }
    );


    /*
    ==================================================
      CAPACITOR APP RESUME SUPPORT
    ==================================================
    */

    document.addEventListener(
      "resume",
      function () {

        setTimeout(
          userReturnedToApp,
          500
        );

      }
    );


    /*
    ==================================================
      RESET COUNT
      Developer console only
    ==================================================

      resetAdsCount();

    ==================================================
    */

    function resetAdsCount() {

      adsCount = 0;

      localStorage.setItem(
        "adsCount",
        "0"
      );

      countElement.textContent = "0";

      statusElement.textContent =
        "Count reset.";

    }

  </script>

</body>

</html>
