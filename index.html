
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Ads Counter</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at 50% 0%,
          #294438 0%,
          #111a15 42%,
          #070908 100%
        );

      color: #ffffff;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 430px;

      min-height: 100vh;

      padding: 30px 20px;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* HEADER */

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 68px;
      height: 68px;

      margin: auto;

      border-radius: 21px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(255,255,255,0.08);

      border: 1px solid rgba(255,255,255,0.12);

      box-shadow:
        0 15px 40px rgba(0,0,0,0.35);

      font-size: 30px;
    }

    .title {
      margin-top: 15px;

      font-size: 28px;
      font-weight: 800;

      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-top: 7px;

      font-size: 14px;

      color: #9aa69f;
    }

    /* CARD */

    .card {
      padding: 30px 22px;

      border-radius: 28px;

      text-align: center;

      background:
        rgba(255,255,255,0.075);

      border:
        1px solid rgba(255,255,255,0.11);

      box-shadow:
        0 25px 60px rgba(0,0,0,0.35);

      backdrop-filter: blur(18px);
    }

    .label {
      color: #a7b2ab;

      font-size: 12px;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    .count {
      margin-top: 10px;

      font-size: 72px;

      line-height: 1;

      font-weight: 900;

      letter-spacing: -4px;
    }

    .count-info {
      margin-top: 9px;

      color: #7f8b84;

      font-size: 13px;
    }

    /* BUTTON */

    .watch-button {
      width: 100%;

      height: 61px;

      margin-top: 25px;

      border: none;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #7ce6a3,
          #3fb875
        );

      color: #06120a;

      font-size: 16px;

      font-weight: 900;

      letter-spacing: 0.8px;

      box-shadow:
        0 12px 30px rgba(63,184,117,0.22);

      transition:
        transform 0.15s,
        opacity 0.15s;
    }

    .watch-button:active {
      transform: scale(0.97);
    }

    .watch-button:disabled {
      opacity: 0.55;
    }

    /* STATUS */

    .status {
      min-height: 20px;

      margin-top: 16px;

      color: #8d9992;

      font-size: 13px;

      line-height: 18px;
    }

    .footer {
      margin-top: 22px;

      text-align: center;

      color: #626e67;

      font-size: 11px;
    }

  </style>

</head>


<body>


  <main class="app">


    <!-- HEADER -->

    <div class="header">

      <div class="logo">
        ▶
      </div>

      <div class="title">
        Ads Counter
      </div>

      <div class="subtitle">
        Watch ads and increase your count
      </div>

    </div>


    <!-- MAIN CARD -->

    <section class="card">

      <div class="label">
        Ads Watched
      </div>


      <div
        id="adsCount"
        class="count"
      >
        0
      </div>


      <div class="count-info">
        Total ad visits
      </div>


      <button
        id="watchButton"
        class="watch-button"
      >
        WATCH ADS
      </button>


      <div
        id="status"
        class="status"
      ></div>

    </section>


    <div class="footer">
      The ad will open in your browser
    </div>


  </main>


  <script>

    /*
    ==================================================
      SMART LINK
    ==================================================
    */

    const SMART_LINK =
      "https://www.profitableratecpmnetwork.com/wnexphc4?key=d0026f6bb8ca08c9453c501d2f7b6627";


    /*
    ==================================================
      ELEMENTS
    ==================================================
    */

    const adsCountElement =
      document.getElementById("adsCount");

    const watchButton =
      document.getElementById("watchButton");

    const statusElement =
      document.getElementById("status");


    /*
    ==================================================
      LOAD COUNT
    ==================================================
    */

    let adsCount =
      parseInt(
        localStorage.getItem("adsCount") || "0",
        10
      );


    adsCountElement.textContent =
      adsCount;


    /*
    ==================================================
      AD SESSION
    ==================================================
    */

    let waitingForReturn = false;

    let openedAt = 0;


    /*
    ==================================================
      WATCH BUTTON
    ==================================================
    */

    watchButton.addEventListener(
      "click",
      function () {

        if (waitingForReturn) {
          return;
        }


        /*
        ----------------------------------------------
          Start session
        ----------------------------------------------
        */

        waitingForReturn = true;

        openedAt = Date.now();


        watchButton.disabled = true;

        watchButton.textContent =
          "OPENING BROWSER...";


        statusElement.textContent =
          "Opening the ad in your browser...";


        /*
        ----------------------------------------------
          Send message to native Android
        ----------------------------------------------
        */

        if (
          window.Android &&
          typeof window.Android.openAd === "function"
        ) {

          window.Android.openAd(
            SMART_LINK
          );

        } else {

          /*
          --------------------------------------------
            Fallback for browser / Live Server
          --------------------------------------------
          */

          window.open(
            SMART_LINK,
            "_blank"
          );

        }

      }
    );


    /*
    ==================================================
      APP RETURN
    ==================================================
    */

    function onAppReturned() {

      if (!waitingForReturn) {
        return;
      }


      const awayTime =
        Date.now() - openedAt;


      /*
      ----------------------------------------------
        Require minimum 2 seconds outside app
      ----------------------------------------------
      */

      if (awayTime >= 2000) {

        adsCount++;

        localStorage.setItem(
          "adsCount",
          String(adsCount)
        );


        adsCountElement.textContent =
          adsCount;


        statusElement.textContent =
          "✓ Ad visit counted +1";

      } else {

        statusElement.textContent =
          "Please stay on the ad longer.";

      }


      waitingForReturn = false;


      watchButton.disabled = false;

      watchButton.textContent =
        "WATCH ADS";

    }


    /*
    ==================================================
      VISIBILITY CHANGE
    ==================================================
    */

    document.addEventListener(
      "visibilitychange",
      function () {

        if (
          document.visibilityState === "visible"
        ) {

          setTimeout(
            onAppReturned,
            500
          );

        }

      }
    );


    /*
    ==================================================
      NATIVE ANDROID CALLBACK
    ==================================================
    */

    window.onAdBrowserReturned =
      function () {

        setTimeout(
          onAppReturned,
          500
        );

      };


    /*
    ==================================================
      RESET FUNCTION
    ==================================================

      Developer console:

      resetAdsCount();

    ==================================================
    */

    function resetAdsCount() {

      adsCount = 0;

      localStorage.setItem(
        "adsCount",
        "0"
      );

      adsCountElement.textContent =
        "0";

    }

  </script>


</body>

</html>
